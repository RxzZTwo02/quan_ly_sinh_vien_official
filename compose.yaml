services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: qlsv
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qlsv_root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    # Không publish cổng 3306 để không xung đột với MySQL của Laragon.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    image: qlsv-backend:2.0
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qlsv_root}
      DB_NAME: qlsv
      DB_CONNECT_RETRIES: 30
      API_HOST: 0.0.0.0
      API_PORT: 5001
      API_TOKEN: ${API_TOKEN:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: qlsv-frontend:2.0
    environment:
      BACKEND_URL: http://backend:5001
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: 5000
      SECRET_KEY: ${SECRET_KEY:-}
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
